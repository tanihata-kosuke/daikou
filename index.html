<title>ダイコウ</title>
<meta name="theme-color" content="#202020">
<style>/* ダイコウ — Dr.トレーニング公式サイトの色（2026-11-20 谷畑さん指示）:
   黒（#202020・#3c3c3c）と灰（#77797c・#b6b6b6）が基本、アクセントは赤→朱のグラデーション（#FF0000→#EA5923）。
   「足りない」は赤の文字と斜線で示す */
:root {
  --ink: #202020;
  --ink-2: #66696d;
  --ink-3: #77797c;
  --line: #dbdfe2;
  --line-2: #f4f5f6;
  --paper: #f4f5f6;
  --surface: #FFFFFF;
  --charcoal: #3c3c3c;
  --red: #FF0000;
  --orange: #EA5923;
  --brand-grad: linear-gradient(90deg, var(--red), var(--orange));
  --brand-soft: #FDEEE8;
  --navy: var(--ink);          /* 数字は黒で強く */
  --navy-soft: #202020;        /* 答えの枠は黒地 */
  --navy-line: #b6b6b6;
  --short: #E60012;
  --short-soft: #FFE9E6;

  --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  --font-num: "SF Pro Display", "Helvetica Neue", "Hiragino Sans", sans-serif;

  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-lg: 1.125rem;
  --text-xl: clamp(1.75rem, 1.2rem + 2vw, 2.5rem);

  --radius: 4px;
  --duration-fast: 150ms;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.num, time, .metric b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---- 上部 ---- */
.masthead {
  position: relative;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 18px clamp(16px, 4vw, 40px) 0;
  background: var(--ink); color: #fff;
}
.masthead::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--brand-grad); }
.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; }
.brand-logo { display: block; height: 24px; width: auto; }
.brand-divider { width: 1px; height: 30px; background: rgb(255 255 255 / 0.25); }
.brand h1 { margin: 0; font-size: 1.375rem; letter-spacing: 0.08em; }
.brand-sub { margin: 0; font-size: var(--text-xs); color: #b6b6b6; }

.tabs { display: flex; gap: 4px; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 10px 16px 12px; font: inherit; font-size: var(--text-sm); color: var(--ink-2);
  border-bottom: 2px solid transparent; transition: color var(--duration-fast) var(--ease);
}
.tab { color: #b6b6b6; }
.tab:hover { color: #fff; }
.tab.is-active { color: #fff; border-bottom-color: var(--orange); font-weight: 600; }
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 2px solid var(--orange); outline-offset: 2px;
}

.banner {
  margin: 0; padding: 8px clamp(16px, 4vw, 40px);
  background: var(--line-2); color: var(--ink-2); font-size: var(--text-sm);
}

main { padding: 28px clamp(16px, 4vw, 40px) 40px; }

.eyebrow {
  margin: 0 0 16px; font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.16em; color: var(--ink-2);
}

/* ---- 探す ---- */
#view-search { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: clamp(20px, 3vw, 48px); align-items: start; }

.request {
  position: sticky; top: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px;
}
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.field > span { font-size: var(--text-xs); color: var(--ink-2); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
select, input[type="date"], input[type="time"], input[type="number"] {
  width: 100%; font: inherit; color: var(--ink);
  padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  transition: border-color var(--duration-fast) var(--ease);
}
select:hover, input:hover { border-color: var(--ink-3); }
input[type="time"] { cursor: pointer; }

.primary, .secondary {
  width: 100%; font: inherit; font-weight: 600; cursor: pointer; border-radius: var(--radius);
  padding: 12px; transition: transform var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease);
}
.primary { border: 0; background: var(--brand-grad); color: #fff; letter-spacing: 0.04em; }
.primary:hover { filter: brightness(1.06); }
.primary:active, .secondary:active { transform: translateY(1px); }
.primary:disabled { opacity: 0.4; cursor: default; }
.primary[aria-busy="true"] { opacity: 0.6; cursor: progress; }
.secondary { border: 1px solid var(--ink); background: var(--surface); color: var(--ink); }
.secondary:hover { background: var(--line-2); }

.form-error { min-height: 1.2em; margin: 8px 0 0; color: var(--short); font-size: var(--text-sm); }

.rule-note { margin-top: 8px; border-top: 1px solid var(--line-2); padding-top: 10px; font-size: var(--text-sm); color: var(--ink-2); }
.rule-note summary { cursor: pointer; color: var(--ink); }
.rule-note ul { margin: 8px 0 0; padding-left: 1.1em; }
.rule-note li { margin-bottom: 4px; }

/* 答えの枠（1ページ1か所） */
.summary {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px;
  padding: 18px 22px; margin-bottom: 20px;
  background: var(--navy-soft); border: 0; border-left: 4px solid var(--orange); border-radius: var(--radius);
}
.summary-main { display: flex; align-items: baseline; gap: 8px; }
.summary-count { font-family: var(--font-num); font-size: var(--text-xl); font-weight: 700; line-height: 1; background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.summary-label { font-weight: 600; color: #fff; }
.summary-req { color: #b6b6b6; font-size: var(--text-sm); }

/* ---- カルティ風の日表示（縦の時間割）: PT＝淡い青・ブロック＝灰・代行＝朱の枠 ---- */
:root {
  --pt: #DCEAF8; --pt-line: #2F6FB5; --pt-ink: #1D3F66;
  --block: #A9AEB3; --block-ink: #fff;
  --band: #F1F2F3; --band-travel: #E4E6E8;
  --k-hour: #dbdfe2; --k-half: #edf0f2;
}
.karte {
  max-height: min(72vh, 760px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.karte-grid {
  display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(128px, 1fr));
  grid-template-rows: auto auto var(--body-h);
  min-width: max-content;
}
.k-head {
  position: sticky; top: 0; z-index: 5; background: var(--surface);
  height: 52px; padding: 8px 8px 6px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line);
  text-align: center;
}
.k-corner { position: sticky; left: 0; z-index: 6; border-left: 0; background: var(--surface); }
.k-name { margin: 0; font-weight: 700; font-size: var(--text-sm); white-space: nowrap; }
.k-home { margin: 0; font-size: 0.6875rem; color: var(--ink-2); white-space: nowrap; }
.k-slack-label { position: sticky; top: 52px; left: 0; z-index: 6; font-size: 0.6875rem; color: var(--ink-2); padding: 4px 6px; border-bottom: 1px solid var(--line); background: var(--surface); }
.k-slack {
  position: sticky; top: 52px; z-index: 4; background: var(--surface);
  display: flex; justify-content: center; gap: 10px; padding: 4px 6px;
  font-size: 0.6875rem; color: var(--ink-2); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line);
  white-space: nowrap;
}
.k-slack b { font-family: var(--font-num); color: var(--ink); font-size: var(--text-xs); }
.k-slack b.is-short { color: var(--short); }
.k-axis { position: sticky; left: 0; z-index: 3; background: var(--surface); }
.k-axis span {
  position: absolute; right: 6px; transform: translateY(-50%);
  font-family: var(--font-num); font-size: 0.6875rem; color: var(--ink-2);
}
.k-axis span:first-child { transform: none; }
.k-col {
  position: relative; border-left: 1px solid var(--line);
  background:
    repeating-linear-gradient(180deg, var(--k-hour) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(180deg, transparent 0 32px, var(--k-half) 32px 33px, transparent 33px 64px);
}
.k-ev {
  position: absolute; left: 3px; right: 3px; z-index: 2; overflow: hidden;
  display: flex; flex-direction: column; padding: 2px 5px;
  border-radius: 3px; font-size: 0.6875rem; line-height: 1.35;
}
.k-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-tag {
  align-self: flex-start; margin-bottom: 1px; padding: 0 5px; border-radius: 2px;
  font-size: 0.625rem; font-weight: 700; line-height: 1.5; letter-spacing: 0.04em;
}
.k-pt { background: var(--pt); color: var(--pt-ink); border-left: 3px solid var(--pt-line); }
.k-pt .k-tag { background: var(--pt-line); color: #fff; }
.k-block { background: var(--block); color: var(--block-ink); }
.k-block .k-tag { background: rgb(255 255 255 / 0.9); color: #5f6368; }
.k-daikou {
  z-index: 3; background: #fff; color: var(--ink); font-weight: 600;
  border: 2px solid var(--orange); box-shadow: 0 2px 8px rgb(234 89 35 / 0.25);
}
.k-daikou .k-tag { background: var(--brand-grad); color: #fff; }
.k-band {
  position: absolute; left: 3px; right: 3px; z-index: 1;
  display: flex; align-items: center; padding: 0 5px;
  background: var(--band); border-top: 1px solid #fff;
  font-size: 0.625rem; color: var(--ink-2); white-space: nowrap; overflow: hidden;
}
.k-band-travel { background: repeating-linear-gradient(135deg, var(--band-travel) 0 4px, var(--band) 4px 8px); color: var(--ink); font-weight: 600; }
.k-band.is-short { background: var(--short-soft); color: var(--short); outline: 1px solid var(--short); }

.group { margin-top: 28px; }
.group-title { margin: 0 0 10px; font-size: var(--text-sm); font-weight: 700; cursor: default; }
.group-title small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.fold > summary { cursor: pointer; padding: 10px 0; border-top: 1px solid var(--line); }
.group-note { margin: 0 0 8px; font-size: var(--text-sm); color: var(--ink-2); }
.names { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; font-size: var(--text-sm); }
.names li { padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.names small { display: block; color: var(--ink-2); font-size: var(--text-xs); }

.empty { padding: 48px 0; color: var(--ink-2); font-size: var(--text-sm); max-width: 40em; }
.empty-lead { font-size: var(--text-lg); color: var(--ink); margin: 0 0 8px; }

/* ---- 設定 ---- */
.settings-grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.panel h3 { margin: 0 0 12px; font-size: var(--text-base); }
.panel-note { font-size: var(--text-sm); color: var(--ink-2); margin: 0 0 14px; }
.fixed-rules { margin: 0 0 14px; padding-left: 1.1em; font-size: var(--text-sm); }
.fixed-rules li { margin-bottom: 4px; }
.step-note { color: var(--ink-2); font-size: var(--text-xs); margin-left: 2px; }
.travel-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.travel-table th { text-align: left; font-size: var(--text-xs); color: var(--ink-2); font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line); }
.travel-table td { padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.travel-table .r { text-align: right; }
.travel-table td.r { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.travel-table td.strong { color: var(--ink); font-weight: 700; }
.msg { min-height: 1.2em; margin: 8px 0 0; font-size: var(--text-sm); color: var(--ink-2); }

.foot { padding: 16px clamp(16px, 4vw, 40px) 32px; font-size: var(--text-xs); color: var(--ink-3); }

@media (max-width: 860px) {
  #view-search, .settings-grid { grid-template-columns: 1fr; }
  .request { position: static; }
  .masthead { flex-direction: column; align-items: flex-start; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

      ...(prev.kind === 'session' ? [step('前のPTのお会計・次回予約', RULES.checkout, 'post', { at: 'item' })] : []),
      step('移動準備', RULES.moveReady, 'prep'),
      travelStep(prev.store, reqStore, t),
      step('PT準備', RULES.sessionPrep, 'prep'),
    ],
  };
}

/** 依頼を終えてから、次の予定 next に間に合うまでに要る時間の内訳 */
function stepsAfter(next, reqStore, travel) {
  const t = travel(reqStore, next.store);
  if (!t) return noRoute(reqStore, next.store);
  if (t.sameSite) return { steps: sameStoreSteps() };
  return {
    steps: [
      step('代行のお会計・次回予約', RULES.checkout, 'post'),
      step('移動準備', RULES.moveReady, 'prep'),
      travelStep(reqStore, next.store, t),
      ...(next.kind === 'session' ? [step('戻ってPT準備', RULES.sessionPrep, 'prep', { at: 'item' })] : []),
    ],
  };
}

const sum = (steps) => steps.reduce((acc, s) => acc + s.minutes, 0);

/** 前（または後）の予定ごとに余裕を出し、いちばん厳しいものを返す */
function tightest(candidates, build, slackOf) {
  let worst = null;
  for (const item of candidates) {
    const built = build(item);
    if (built.error) return { item, error: built.error };
    const need = sum(built.steps);
    const slack = slackOf(item, need);
    if (!worst || slack < worst.slack) worst = { item, steps: built.steps, need, slack };
  }
  return worst;
}

/**
 * 1人のトレーナーについて判定する。
 * items: そのトレーナーの当日の予定 [{start, end, store, kind: 'session'|'block', label?}]（分）
 * req: { store, start, end }（分）
 * 戻り値の status: ok（入れる）／short（時間が足りない）／busy（重なる）／unreachable（移動できない）／unknown（当日の予定なし）
 */
function evaluateTrainer(items, req, travel) {
  if (!items.length) return { status: 'unknown', before: null, after: null };

  const overlaps = items.filter((it) => it.start < req.end && it.end > req.start);
  if (overlaps.length) return { status: 'busy', overlaps, before: null, after: null };

  const before = tightest(
    items.filter((it) => it.end <= req.start),
    (it) => stepsBefore(it, req.store, travel),
    (it, need) => req.start - it.end - need,
  );
  const after = tightest(
    items.filter((it) => it.start >= req.end),
    (it) => stepsAfter(it, req.store, travel),
    (it, need) => it.start - req.end - need,
  );
  if ((before && before.error) || (after && after.error)) {
    return { status: 'unreachable', reason: (before && before.error) || after.error, before, after };
  }
  const slacks = [before, after].filter(Boolean).map((x) => x.slack);
  const minSlack = slacks.length ? Math.min(...slacks) : null;
  const status = minSlack === null || minSlack >= 0 ? 'ok' : 'short';
  return { status, before, after, minSlack, shortfall: status === 'short' ? -minSlack : 0 };
}

const travelMinutes = (side) => (side && side.steps
  ? side.steps.filter((s) => s.kind === 'travel').reduce((a, s) => a + s.minutes, 0)
  : 0);

/** 受付時間（カルティの勤務時間）を重なり・つながりでまとめる */
function mergeSpans(spans) {
  return [...spans].sort((a, b) => a.start - b.start).reduce((acc, sp) => {
    const last = acc[acc.length - 1];
    return last && sp.start <= last.end
      ? [...acc.slice(0, -1), { start: last.start, end: Math.max(last.end, sp.end) }]
      : [...acc, { start: sp.start, end: sp.end }];
  }, []);
}

/**
 * 受付時間で判定を上書きする（schedule.shifts があるときだけ）。
 * - その日に受付時間が1件もない → off（休み）
 * - 依頼の時間が受付時間の外 → offshift（受付時間外）
 * - 受付時間があっても予定が0件 → unknown のまま（受付時間は「予約を受けられる時間」で、出勤とは限らないため・2026-11-20 実データで確認）
 */
function applyShifts(judged, spans, req) {
  if (!spans.length) return { status: 'off', before: null, after: null };
  const covered = spans.some((sp) => sp.start <= req.start && req.end <= sp.end);
  if (!covered) return { status: 'offshift', spans, before: null, after: null };
  return { ...judged, spans };
}

/**
 * 全トレーナーを判定して、入れる人を上に並べる。
 * schedule: { trainers: [{id, name, home?, stores}], items: [{trainerId, date, start:'HH:MM', end, store, kind, label}],
 *             shifts?: [{trainerId, date, start, end, store}] }（shifts＝カルティの勤務時間。あれば休み・受付時間外を判定）
 * request: { store, date, start:'HH:MM', duration }
 */
function findHelpers(schedule, stores, travelTable, googleTable, request, options = {}) {
  // 出勤＝当日セッションが1件以上ある人（谷畑さん決定 2026-11-20）。false にすると予約かブロックがあれば数える（試算の参考用）
  const requireSession = options.requireSession !== false;
  const travel = createTravel(stores, travelTable, googleTable);
  const start = toMin(request.start);
  const req = { store: request.store, start, end: start + Number(request.duration) };
  const reqRegion = (stores.find((s) => s.name === request.store) || {}).region;
  const storeRegion = new Map(stores.map((s) => [s.name, s.region]));

  const dayItems = schedule.items
    .filter((it) => it.date === request.date)
    .map((it) => ({ ...it, start: toMin(it.start), end: toMin(it.end) }));
  const hasShifts = Array.isArray(schedule.shifts);
  const dayShifts = hasShifts
    ? schedule.shifts.filter((sh) => sh.date === request.date).map((sh) => ({ ...sh, start: toMin(sh.start), end: toMin(sh.end) }))
    : [];

  const results = schedule.trainers
    .filter((tr) => (tr.stores || []).some((s) => storeRegion.get(s) === reqRegion)
      || dayItems.some((it) => it.trainerId === tr.id && storeRegion.get(it.store) === reqRegion))
    .map((tr) => {
      const items = dayItems
        .filter((it) => it.trainerId === tr.id)
        .sort((a, b) => a.start - b.start);
      const hasSession = items.some((it) => it.kind === 'session');
      const raw = evaluateTrainer(items, req, travel);
      const shifted = hasShifts
        ? applyShifts(raw, mergeSpans(dayShifts.filter((sh) => sh.trainerId === tr.id)), req)
        : raw;
      // セッションが無い日は出勤か分からないので、入れる／あと少しには出さない
      const judged = requireSession && !hasSession && (shifted.status === 'ok' || shifted.status === 'short')
        ? { ...shifted, status: 'unknown', noSession: true }
        : shifted;
      // 自店舗＝主な店舗（カルティの branchID）。無ければ所属店舗のどれか
      const isOwnStore = tr.home ? tr.home === req.store : (tr.stores || []).includes(req.store);
      return {
        trainer: tr,
        isOwnStore,
        hasSession,
        items,
        ...judged,
        travelTotal: travelMinutes(judged.before) + travelMinutes(judged.after),
      };
    });

  const order = { ok: 0, short: 1, unknown: 2, offshift: 3, busy: 4, unreachable: 5, off: 6 };
  const sorted = [...results].sort((a, b) => (order[a.status] - order[b.status])
    || (a.status === 'short' ? a.shortfall - b.shortfall : 0)
    || (Number(b.isOwnStore) - Number(a.isOwnStore))
    || (a.travelTotal - b.travelTotal)
    || ((b.minSlack ?? 0) - (a.minSlack ?? 0))
    || a.trainer.name.localeCompare(b.trainer.name, 'ja'));

  return { request: { ...request, end: fromMin(req.end) }, rules: RULES, results: sorted };
}

module.exports = {
  RULES, toMin, fromMin, pairKey, createTravel, evaluateTrainer, mergeSpans, findHelpers,
};

window.DAIKOU_LIB = module.exports; })();</script>
<script>
(() => {

<script>/* ダイコウ 画面。データは textContent でだけ入れる（innerHTML は使わない） */
(() => {
  const $ = (id) => document.getElementById(id);
  let META = null;

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

  async function api(method, url, body) {
    if (window.DAIKOU_LOCAL_API) return window.DAIKOU_LOCAL_API(method, url, body); // 共有版（サーバーなし）
    const res = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '通信に失敗しました');
    return data;
  }

  /* ---------- 初期化 ---------- */
  async function init() {
    try {
      META = await api('GET', '/api/meta');
    } catch (err) {
      $('banner').hidden = false;
      $('banner').textContent = `読み込めませんでした: ${err.message}`;
      return;
    }
    fillStores();
    fillRuleNote();
    fillDate();
    showSource();
    fillFixedRules();
    fillTravelBase();
    bindTabs();
    $('request-form').addEventListener('submit', onSearch);
    openPickerOnClick($('f-start'));
    $('request-form').querySelector('.primary').disabled = false;
  }

  /** 時計マークだけでなく、枠のどこを押しても時刻の選択を開く */
  function openPickerOnClick(input) {
    input.addEventListener('click', () => {
      try { input.showPicker(); } catch { /* 対応していないブラウザはそのまま入力 */ }
    });
  }

  function storeOptions(select, predicate) {
    const groups = {};
    META.stores.filter(predicate || (() => true)).forEach((s) => { (groups[s.region] = groups[s.region] || []).push(s); });
    select.replaceChildren();
    Object.entries(groups).forEach(([region, list]) => {
      const og = el('optgroup');
      og.label = region;
      list.forEach((s) => { const o = el('option', null, s.name); o.value = s.name; og.append(o); });
      select.append(og);
    });
  }

  function fillStores() {
    storeOptions($('f-store'));
    $('f-store').value = '学芸大学店';
  }

  function fillDate() {
    const today = new Date();
    const iso = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const input = $('f-date');
    input.value = META.dates.includes(iso) || !META.dates.length ? iso : META.dates[0];
    if (META.dates.length) { input.min = META.dates[0]; input.max = META.dates[META.dates.length - 1]; }
  }

  function fillRuleNote() {
    const r = META.rules;
    const lines = [
      '依頼の時間に、予約・ブロックが1つも重ならない',
      `前の店舗のPT → お会計・次回予約${r.checkout}分 → 移動準備${r.moveReady}分 → 移動 → PT準備${r.sessionPrep}分 が依頼の開始までに収まる`,
      `代行の後 → お会計・次回予約${r.checkout}分 → 移動準備${r.moveReady}分 → 移動 → 戻ってPT準備${r.sessionPrep}分 が次の予定までに収まる`,
      '移動＝Google マップの電車の時間＋10%（店舗の組ごとに自動で計算済み）',
      '前の予定がブロックなら会計は無し、次の予定がブロックなら準備は無し。同じ店舗どうしは移動なし',
    ];
    $('rule-list').replaceChildren(...lines.map((t) => el('li', null, t)));
  }

  function showSource() {
    // 説明の帯は出さない（谷畑さん 2026-11-21）。見本データと、データが無いときだけ知らせる
    if (META.isDemo) {
      $('banner').hidden = false;
      $('banner').textContent = '見本データで動いています（トレーナーと予定は架空）。';
    } else if (!META.hasSchedule) {
      $('banner').hidden = false;
      $('banner').textContent = '予定のデータがまだありません。fetch/fetch_schedule.py でカルティから取り込んでください。';
    }
  }

  function bindTabs() {
    document.querySelectorAll('.tab').forEach((btn) => btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((b) => {
        const on = b === btn;
        b.classList.toggle('is-active', on);
        if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
      $('view-search').hidden = btn.dataset.tab !== 'search';
      $('view-settings').hidden = btn.dataset.tab !== 'settings';
    }));
  }

  /* ---------- 探す ---------- */
  async function onSearch(ev) {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const body = Object.fromEntries(f.entries());
    const btn = ev.target.querySelector('.primary');
    $('form-error').textContent = '';
    btn.setAttribute('aria-busy', 'true');
    try {
      render(await api('POST', '/api/search', body));
    } catch (err) {
      $('form-error').textContent = err.message;
    } finally {
      btn.removeAttribute('aria-busy');
    }
  }

  function render(out) {
    const by = (s) => out.results.filter((r) => r.status === s);
    const ok = by('ok');
    const short = by('short');
    const unknown = by('unknown');
    const busy = [...by('busy'), ...by('offshift'), ...by('unreachable')];
    const off = by('off');
    const req = out.request;

    $('empty').hidden = true;
    const sum = $('summary');
    sum.hidden = false;
    const main = el('div', 'summary-main');
    main.append(el('span', 'summary-count', String(ok.length)), el('span', 'summary-label', '人が代行に入れます'));
    sum.replaceChildren(main);

    $('list-ok').replaceChildren(...(ok.length ? [schedule(ok, req)] : []));
    $('group-short').hidden = !short.length;
    $('list-short').replaceChildren(...(short.length ? [schedule(short.slice(0, 8), req)] : []));

    $('group-unknown').hidden = !unknown.length;
    $('unknown-count').textContent = `${unknown.length}人`;
    $('list-unknown').replaceChildren(...unknown.map((r) => nameRow(r, (r.trainer.stores || []).join('・'))));

    $('group-busy').hidden = !busy.length;
    $('busy-count').textContent = `${busy.length}人${off.length ? `（ほかに当日休み ${off.length}人）` : ''}`;
    $('list-busy').replaceChildren(...busy.map((r) => nameRow(r, busyReason(r))));
  }

  function busyReason(r) {
    if (r.status === 'unreachable') return r.reason;
    if (r.status === 'offshift') return `受付時間外（${r.spans.map((sp) => `${hhmm(sp.start)}〜${hhmm(sp.end)}`).join('・')}）`;
    const o = r.overlaps[0];
    const kind = o.kind === 'session' ? 'PT' : (o.label || 'ブロック');
    return `${hhmm(o.start)}〜${hhmm(o.end)} ${kind}（${o.store}）と重なる`;
  }

  function nameRow(r, sub) {
    const li = el('li', null, r.trainer.name);
    li.append(el('small', null, sub));
    return li;
  }

  /* ---------- カルティ風の日表示（縦の時間割・人ごとの列） ---------- */
  const PX_PER_MIN = 64 / 60;   // 1時間 = 64px
  const GRID_START = 7 * 60;
  const GRID_END = 23 * 60;
  const y = (m) => (Math.max(GRID_START, Math.min(GRID_END, m)) - GRID_START) * PX_PER_MIN;
  const shortStore = (name) => name.replace('Dr.ピラティス', 'ピラティス').replace(/店$/, '');

  /** 同じ予定が2店舗に入っているもの（本店とANNEX等）は1つにまとめる */
  function dedupe(items) {
    const map = new Map();
    items.forEach((it) => {
      const key = [it.start, it.end, it.kind, it.label || ''].join('|');
      const hit = map.get(key);
      if (hit) { if (!hit.stores.includes(it.store)) hit.stores.push(it.store); } else map.set(key, { ...it, stores: [it.store] });
    });
    return [...map.values()].sort((p, q) => p.start - q.start);
  }

  function schedule(list, req) {
    const wrap = el('div', 'karte');
    const grid = el('div', 'karte-grid');
    grid.style.setProperty('--cols', String(list.length));
    grid.style.setProperty('--body-h', `${(GRID_END - GRID_START) * PX_PER_MIN}px`);

    grid.append(el('div', 'k-corner k-head'), ...list.map((r) => headCell(r)));
    grid.append(el('div', 'k-corner k-slack-label', '余裕'), ...list.map((r) => slackCell(r)));
    grid.append(timeAxis(), ...list.map((r) => column(r, req)));
    wrap.append(grid);
    requestAnimationFrame(() => { wrap.scrollTop = Math.max(0, y(toMin(req.start) - 150)); });
    return wrap;
  }

  function headCell(r) {
    const h = el('div', 'k-head');
    const name = el('p', 'k-name', r.trainer.name);
    h.append(name, el('p', 'k-home', r.isOwnStore ? '自店舗' : shortStore(r.trainer.home || (r.trainer.stores || [])[0] || '')));
    h.title = (r.trainer.stores || []).join('・');
    return h;
  }

  function slackCell(r) {
    const c = el('div', 'k-slack');
    const part = (label, side) => {
      const s = el('span');
      if (!side) { s.textContent = `${label} 予定なし`; return s; }
      const short = side.slack < 0;
      s.append(`${label} `, el('b', short ? 'is-short' : '', short ? `${-side.slack}分不足` : `${side.slack}分`));
      return s;
    };
    c.append(part('前', r.before), part('後', r.after));
    return c;
  }

  function timeAxis() {
    const a = el('div', 'k-axis');
    for (let m = GRID_START; m < GRID_END; m += 60) {
      const t = el('span', null, `${m / 60}:00`);
      t.style.top = `${y(m)}px`;
      a.append(t);
    }
    return a;
  }

  function column(r, req) {
    const col = el('div', 'k-col');
    const s = toMin(req.start);
    const e = toMin(req.end);
    if (r.before) bands(col, r.before, req, true);
    if (r.after) bands(col, r.after, req, false);
    dedupe(r.items).forEach((it) => col.append(event(it)));
    const d = el('div', 'k-ev k-daikou');
    place(d, s, e);
    d.append(el('span', 'k-tag', '代行'), el('span', 'k-line', shortStore(req.store)), el('span', 'k-line num', `${req.start}-${req.end}`));
    col.append(d);
    return col;
  }

  function place(n, a, b) {
    n.style.top = `${y(a)}px`;
    n.style.height = `${Math.max(14, y(b) - y(a))}px`;
  }

  function event(it) {
    const isBlock = it.kind === 'block';
    const n = el('div', `k-ev ${isBlock ? 'k-block' : 'k-pt'}`);
    place(n, it.start, it.end);
    const where = it.stores.length > 1 && !isBlock ? shortStore(it.stores.find((x) => !x.startsWith('Dr.')) || it.stores[0]) : shortStore(it.stores[0]);
    n.append(el('span', 'k-tag', isBlock ? 'ブロック' : 'PT'));
    if (isBlock) n.append(el('span', 'k-line', it.label || 'ブロック'));
    n.append(el('span', 'k-line', where), el('span', 'k-line num', `${hhmm(it.start)}-${hhmm(it.end)}`));
    if (!isBlock) n.append(el('span', 'k-line num', `${it.end - it.start}分PT`));
    n.title = `${isBlock ? (it.label || 'ブロック') : 'PT'}　${it.stores.join('・')}　${hhmm(it.start)}〜${hhmm(it.end)}`;
    return n;
  }

  /**
   * 代行の前後に要る時間を、手順ごとの帯で描く。
   * 会計（前のPTの後）と戻ってPT準備（次のPTの前）はPTにくっつけ、空きが無いときだけ描く。
   * 移動準備・移動・PT準備（前）／会計・移動準備・移動（後）は代行にくっつける。
   */
  function bands(col, side, req, isBefore) {
    const s = toMin(req.start);
    const e = toMin(req.end);
    const nearItem = side.steps.filter((st) => st.at === 'item');
    const nearReq = side.steps.filter((st) => st.at !== 'item');
    const len = (xs) => xs.reduce((acc, st) => acc + st.minutes, 0);
    const short = side.slack < 0;
    // 会計・戻ってPT準備は、移動の帯とくっつく（空きが無い）ときだけ描く（谷畑さん 2026-11-20）。計算には常に入る
    const touching = side.slack <= 0;
    if (isBefore) {
      if (touching) drawRun(col, nearItem, side.item.end, short);
      drawRun(col, nearReq, s - len(nearReq), short);
    } else {
      drawRun(col, nearReq, e, short);
      if (touching) drawRun(col, nearItem, side.item.start - len(nearItem), short);
    }
  }

  function drawRun(col, steps, startAt, short) {
    let t = startAt;
    steps.forEach((st) => {
      const b = el('div', `k-band k-band-${st.kind}${short ? ' is-short' : ''}`);
      place(b, t, t + st.minutes);
      const name = st.kind === 'travel' ? '移動' : st.label.replace(/^(前のPTの|代行の)/, '').replace('戻って', '');
      b.append(el('span', null, `${name} ${st.minutes}分`));
      b.title = `${hhmm(t)}〜${hhmm(t + st.minutes)} ${st.label}${st.note ? `（${st.note}）` : ''}`;
      col.append(b);
      t += st.minutes;
    });
  }


  /* ---------- 移動時間（表示だけ） ---------- */
  function fillFixedRules() {
    const r = META.rules;
    const count = Object.keys(META.travel).length;
    $('travel-method').textContent = `${META.travelMethod || '未計測'}。記録 ${count}組（同じ地域の店舗どうし・片道を調べて逆向きも同じとみなす）。`;
    $('fixed-rules').replaceChildren(...[
      `PT準備 ${r.sessionPrep}分（固定）`,
      `PT後のお会計・次回予約 ${r.checkout}分（固定）`,
      `移動準備 ${r.moveReady}分（出発するとき・戻るとき それぞれ）`,
    ].map((t) => el('li', null, t)));
  }

  function fillTravelBase() {
    const sel = $('travel-base');
    storeOptions(sel);
    sel.value = '学芸大学店';
    sel.onchange = renderTravel;
    renderTravel();
  }

  function renderTravel() {
    const base = META.stores.find((s) => s.name === $('travel-base').value);
    const rows = META.stores
      .filter((s) => s.name !== base.name && s.region === base.region)
      .map((s) => {
        const key = [base.name, s.name].sort().join('|');
        return { name: s.name, google: META.google[key], travel: META.travel[key] };
      })
      .sort((a, b) => (a.travel ?? 1e9) - (b.travel ?? 1e9));
    $('travel-body').replaceChildren(...rows.map((r) => {
      const tr = el('tr');
      tr.append(el('td', null, r.name),
        el('td', 'r num', Number.isFinite(r.google) ? `${r.google}分` : '—'),
        el('td', 'r num strong', Number.isFinite(r.travel) ? `${r.travel}分` : '未計測'));
      return tr;
    }));
  }

  init();
})();
</script>
</body>
